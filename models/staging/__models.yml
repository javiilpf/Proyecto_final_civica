
version: 2

models:
  - name: NIVEL_COMPETICION
    description: "nivel de competicion"
    config:
      materialized: table
      schema: silver
  - name: dim_pais
    description: "Dimensión de países, extraída de ciclista y equipo"
    config:
      materialized: table
      schema: SILVER
    columns:
      - name: id_pais
        tests: [not_null, unique]
      - name: codigo_iso
        tests: [not_null, unique]

  - name: ciclista
    description: "Ciclistas limpios con FK a dim_pais y categoria"
    config:
      materialized: table
      schema: SILVER
    columns:
      - name: id_ciclista
        tests: [not_null, unique]
      - name: id_equipo
        tests: [not_null]

  - name: resultado
    description: "Resultados de etapa con todas las FKs resueltas"
    config:
      materialized: table
      schema: SILVER
    columns:
      - name: id_resultado
        tests: [not_null, unique]
      - name: id_ciclista
        tests: [not_null]
      - name: id_competicion
        tests: [not_null]
      - name: id_etapa
        tests: [not_null]
  # ... resto de modelos



