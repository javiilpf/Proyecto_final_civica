
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.



models:
  +transient: false # Evita que snow cree tablas transient por defecto (no tiene time travel ni fail-safe)
  repo_demo:
    raw:
      +materialized: view
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_BRONZE_DB"

      # google_sheets:
      #   +schema: google_sheets        # Schema dentro de SILVER_DB

      # sql_server_dbo:
      #   +schema: sql_server_dbo      TENER EN CUENTA CUANDO CREE LOS MODELOS

    # ------------------------------------------------------------------------
    # STAGING — Capa Silver
    # Materializados como vista (sin coste de almacenamiento, siempre datos
    # actualizados al consultar). Apuntan a la BD SILVER del entorno
    staging:
      +materialized: view
      +database: "DEV_SILVER_DB"

     #   staging:
     # +materialized: view
     # +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_SILVER_DB"
    # COPIAR DEL SCHEMA ANTERIOR CUANDO CREE LOS MODELOS ANTERIORES

    # ------------------------------------------------------------------------
    # MARTS — Capa Gold
    # ------------------------------------------------------------------------
    # Los marts son la capa de consumo. Materializados como tabla por defecto
    # (rendimiento óptimo para BI). Apuntan a la BD GOLD del entorno.
    # ------------------------------------------------------------------------
    marts:
      +materialized: table
      +database: "DEV_GOLD_DB"

      # core:
      #   +schema: core

      #   # Los modelos intermedios viven dentro de marts/core/intermediate
      #   # pero los configuramos como vistas en un schema separado para no
      #   # exponerlos al consumidor final.
      #   intermediate:
      #     +materialized: view
      #     +schema: intermediate

      # product:
      #   +schema: product              # Mart específico del equipo de Producto

      # marketing:
      #   +schema: marketing            # Mart específico del equipo de Marketing